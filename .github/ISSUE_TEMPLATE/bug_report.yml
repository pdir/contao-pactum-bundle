name: Bug report
description: Report a bug in Pactum
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              **Security issues must not be reported here** – please use "Report a vulnerability" (see SECURITY.md).
              Please do not post real personal data (names, e-mail addresses, contract contents).
    - type: input
      id: versions
      attributes:
          label: Versions
          description: Pactum, Contao, PHP and database version
          placeholder: Pactum 0.1.0, Contao 5.7.17, PHP 8.3, MySQL 8.4
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: Description
          description: What happened and what did you expect?
      validations:
          required: true
    - type: textarea
      id: reproduce
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. …
              2. …
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Logs / error messages
          description: Remove personal data before posting.
          render: text
